<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="description" content="两篇随笔：湖光晓悟东坡、我的宝贝。">
<title>文章</title>
<style>
  :root{
    --paper:#f7f3ea;
    --paper-deep:#efe8d9;
    --ink:#3d3b36;
    --ink-soft:#7a7468;
    --lake:#4f7f76;
    --lake-deep:#3d665e;
    --lake-soft:#a9c6bd;
    --gold:#c08d3f;
    --line:#ddd4c0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.9;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 24px 72px}

  .hero{max-width:640px;margin:0 auto}
  .hero svg{display:block;width:100%;height:auto}

  .title-wrap{padding:30px 0 8px;text-align:center}
  .kicker{font-size:12px;letter-spacing:.55em;text-indent:.55em;color:var(--ink-soft);margin-bottom:16px}
  h1{
    font-family:"Kaiti SC","KaiTi","STKaiti","Noto Serif SC",serif;
    font-weight:600;
    font-size:38px;
    letter-spacing:.3em;
    text-indent:.3em;
    color:var(--ink);
    line-height:1.5;
  }
  .title-sub{
    margin-top:14px;
    font-size:13px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:var(--ink-soft);
  }

  .list{padding-top:34px}
  .card{
    display:flex;align-items:center;gap:16px;
    background:#fff;
    padding:20px 18px;
    margin:0 0 16px;
    border-radius:14px;
    border:1px solid #eee6d6;
    text-decoration:none;color:inherit;
    transition:border-color .2s, box-shadow .2s, transform .2s;
  }
  .card:active{transform:scale(.985)}
  .card:hover{border-color:var(--lake-soft);box-shadow:0 4px 18px rgba(93,111,102,.08)}
  .ic{
    width:52px;height:52px;border-radius:13px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;
  }
  .ic.a{background:#e4f0ec}
  .ic.b{background:#f6e4dc}
  .if{flex:1;min-width:0}
  .if .t{font-size:19px;font-weight:600;font-family:"Kaiti SC","KaiTi","STKaiti",serif;letter-spacing:.06em;color:#2f2d28}
  .if .s{font-size:12.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.05em}
  .ar{font-size:20px;color:var(--lake-soft);flex-shrink:0}

  .tip{
    margin-top:34px;padding:14px 18px;
    border:1px dashed var(--line);border-radius:12px;
    font-size:12.5px;color:var(--ink-soft);
    letter-spacing:.06em;line-height:2;
    text-align:center;
  }

  footer{
    margin-top:48px;padding-top:26px;
    border-top:1px solid var(--line);
    text-align:center;
    font-size:12.5px;
    letter-spacing:.22em;
    color:var(--ink-soft);
  }
  footer .seal{
    font-family:"Songti SC","SimSun",serif;
    font-size:11px;letter-spacing:.12em;text-indent:.12em;
    color:#b3563a;border:1.5px solid #b3563a;border-radius:4px;
    padding:2px 5px;transform:rotate(-4deg);opacity:.92;
    display:inline-block;margin-bottom:12px;
  }
</style>
</head>
<body>

<div class="hero">
  <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="水墨湖山：远山、朝阳与波纹">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9f0e9"/>
        <stop offset="1" stop-color="#f7f3ea"/>
      </linearGradient>
      <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#f0d9a8"/>
        <stop offset="1" stop-color="#e3b97c"/>
      </radialGradient>
    </defs>
    <rect width="1200" height="300" fill="url(#sky)"/>
    <circle cx="940" cy="86" r="60" fill="#e8c48a" opacity="0.22"/>
    <circle cx="940" cy="86" r="34" fill="url(#sun)" opacity="0.92"/>
    <path d="M0,178 C150,140 260,160 400,130 C540,100 660,142 800,120 C940,98 1060,132 1200,104 L1200,300 L0,300 Z" fill="#bcd3cb" opacity="0.72"/>
    <path d="M0,214 C160,184 300,200 450,180 C600,160 740,196 900,176 C1030,160 1140,182 1200,170 L1200,300 L0,300 Z" fill="#9dbfb4" opacity="0.85"/>
    <path d="M0,256 C200,236 380,250 560,236 C740,222 900,242 1200,226 L1200,300 L0,300 Z" fill="#7ba89d"/>
    <g stroke="#eef5f0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M120,282 C240,274 340,288 460,280 C580,272 700,286 820,278"/>
      <path d="M260,294 C380,286 480,300 600,292 C720,284 840,298 960,290"/>
    </g>
  </svg>
</div>

<div class="wrap">
  <header class="title-wrap">
    <div class="kicker">个 人 随 笔</div>
    <h1>文章</h1>
    <div class="title-sub">湖 光 与 旧 衣</div>
  </header>

  <div class="list">
    <a class="card" href="dongpo.html">
      <div class="ic a">🌅</div>
      <div class="if">
        <div class="t">湖光晓悟东坡</div>
        <div class="s">西湖晨记 · 从淡妆浓抹里读懂苏轼的一生</div>
      </div>
      <span class="ar">›</span>
    </a>
    <a class="card" href="baobei.html">
      <div class="ic b">🧥</div>
      <div class="if">
        <div class="t">我的宝贝</div>
        <div class="s">年关旧衣 · 一件磨破袖口的冲锋衣，一本纪念册</div>
      </div>
      <span class="ar">›</span>
    </a>
  </div>

  <div class="tip">两篇随笔 · 一湖一人<br>点击卡片阅读</div>

  <footer>
    <span class="seal">随笔</span>
    <div>个 人 随 笔 集</div>
  </footer>
</div>

</body>
</html>
